name: Node and Electron validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  root-application:
    name: Root application / Node 20
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js 20.18.1 and root npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root lock file (repository root)
        run: npm ci
      - name: Check root JavaScript syntax (repository root)
        run: find src/main renderer -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate Electron dependency and entry point (repository root)
        run: npm ls electron --depth=0 && node --check "$(node -p "require('./package.json').main")" && node -p "'Electron ' + require('electron/package.json').version"
      - name: Validate package contents without creating an artifact (repository root)
        run: npm pack --dry-run

  historical-app:
    name: Historical app / manifest isolation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js 20.18.1 (no app cache)
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
      - name: Confirm app is not using the root lock file
        working-directory: app
        run: |
          test -f package.json
          test ! -e package-lock.json
          echo 'app/ is a historical prototype without a lock file; dependency installation is intentionally skipped.'
      - name: Check historical app JavaScript syntax (app directory)
        working-directory: app
        run: find . -path ./node_modules -prune -o -type f -name '*.js' -print0 | xargs -0 -n1 node --check
