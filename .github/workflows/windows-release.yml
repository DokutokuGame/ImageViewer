name: Windows release package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Windows 2025 x64 clean package verification
    runs-on: windows-2025
    steps:
      - name: Check out repository without local state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js 20.18.1
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the locked dependency tree
        run: npm ci
      - name: Build the Windows x64 portable package and SHA-256 file
        run: npm run build:windows
      - name: Verify checksum, clean extraction, executable, and app version
        run: npm run verify:windows
      - name: Upload the reproducible release candidates
        uses: actions/upload-artifact@v4
        with:
          name: ImageViewer-0.1.0-windows-x64
          path: |
            dist/ImageViewer-0.1.0-win-x64.zip
            dist/ImageViewer-0.1.0-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
