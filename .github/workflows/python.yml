name: Python validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.12 / install and pytest
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12.8
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: 3.12.8
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test runner (repository root)
        working-directory: .
        run: python -m pip install --disable-pip-version-check -e . pytest==8.3.4
      - name: Run pytest (repository root)
        working-directory: .
        run: python -m pytest -ra

  static-checks:
    name: Python 3.12 / basic static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12.8
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: 3.12.8
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Ruff 0.8.4
        working-directory: .
        run: python -m pip install --disable-pip-version-check ruff==0.8.4
      - name: Compile Python sources (repository root)
        working-directory: .
        run: python -m compileall -q src tests
      - name: Run Ruff on application sources (repository root)
        working-directory: .
        run: ruff check src
