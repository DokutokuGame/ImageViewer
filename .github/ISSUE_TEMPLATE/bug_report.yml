name: Bug 报告
description: 提交可复现的功能、崩溃或性能问题
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请按 SECURITY.md 私下报告，不要在此公开；请勿上传私人媒体或真实敏感路径。
  - type: textarea
    id: summary
    attributes:
      label: 问题摘要
      description: 简洁说明发生了什么，以及你预期看到什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行……
        2. 选择一个无敏感内容的测试目录……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统、提交哈希、Node/npm/Electron 版本。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 请先移除用户名、本地路径、媒体内容和其他敏感信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 这不是需要私下报告的安全漏洞。
          required: true
